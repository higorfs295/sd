# Cluster DFS completo: Kafka + coordenador + 5 nós, todos na mesma rede compose.
# A app continua podendo rodar no host via run_cluster.py; este compose é a via containerizada.

x-app-env: &app-env
  # Onde os nós/CLI acham o coordenador (e onde o coordenador faz bind do próprio nome).
  COORDINATOR_HOST: coordinator
  # Host anunciado de cada nó. Cada container resolve "nodeN" via DNS do compose.
  # Precisa estar em TODOS os containers por causa da re-replicação (nó-fonte resolve o destino pelo config local).
  NODE1_HOST: node1
  NODE2_HOST: node2
  NODE3_HOST: node3
  NODE4_HOST: node4
  NODE5_HOST: node5
  # Broker interno do Kafka (listener INTERNAL). NÃO usar localhost:9092 dentro da rede.
  KAFKA_BROKER_URL: kafka-1:29092

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: dfs-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_OPTS: "-XX:-UseContainerSupport"
    ports:
      - "2181:2181"

  kafka-1:
    image: confluentinc/cp-kafka:7.3.0
    container_name: dfs-kafka-1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_OPTS: "-XX:-UseContainerSupport"

  kafka-2:
    image: confluentinc/cp-kafka:7.3.0
    container_name: dfs-kafka-2
    depends_on:
      - zookeeper
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29093,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29093,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_OPTS: "-XX:-UseContainerSupport"

  # ---------------- App DFS ----------------
  coordinator:
    build: .
    image: dfs-app:local
    container_name: dfs-coordinator
    depends_on:
      - kafka-1
      - kafka-2
    command: ["python", "-m", "dfs.interface.server"]
    environment:
      <<: *app-env
    ports:
      - "9100:9100"
    volumes:
      # Necessário para o test_chaos_advanced controlar (kill/start) os containers de nó.
      - /var/run/docker.sock:/var/run/docker.sock

  node1:
    image: dfs-app:local
    container_name: dfs-node1
    depends_on:
      - coordinator
    command: ["python", "-m", "dfs.interface.storage_node", "--node-id", "node1"]
    environment:
      <<: *app-env
    ports:
      - "9101:9101"

  node2:
    image: dfs-app:local
    container_name: dfs-node2
    depends_on:
      - coordinator
    command: ["python", "-m", "dfs.interface.storage_node", "--node-id", "node2"]
    environment:
      <<: *app-env
    ports:
      - "9102:9102"

  node3:
    image: dfs-app:local
    container_name: dfs-node3
    depends_on:
      - coordinator
    command: ["python", "-m", "dfs.interface.storage_node", "--node-id", "node3"]
    environment:
      <<: *app-env
    ports:
      - "9103:9103"

  node4:
    image: dfs-app:local
    container_name: dfs-node4
    depends_on:
      - coordinator
    command: ["python", "-m", "dfs.interface.storage_node", "--node-id", "node4"]
    environment:
      <<: *app-env
    ports:
      - "9104:9104"

  node5:
    image: dfs-app:local
    container_name: dfs-node5
    depends_on:
      - coordinator
    command: ["python", "-m", "dfs.interface.storage_node", "--node-id", "node5"]
    environment:
      <<: *app-env
    ports:
      - "9105:9105"